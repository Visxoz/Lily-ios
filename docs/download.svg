<svg xmlns="http://www.w3.org/2000/svg" width="360" height="76" viewBox="0 0 360 76">
  <title>Download for iPhone</title>
  <style>
    text { font-family: -apple-system, 'SF Pro Display', system-ui, 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
  </style>
  <rect x="0.5" y="0.5" width="359" height="75" rx="18" fill="#121216" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- A phone, in the accent -->
  <g transform="translate(28 18)">
    <rect x="0" y="0" width="22" height="40" rx="5" fill="none" stroke="#d65db1" stroke-width="3"/>
    <rect x="7" y="4" width="8" height="2.5" rx="1.25" fill="#d65db1"/>
  </g>

  <text x="72" y="36" font-size="20" font-weight="700" fill="#f4f4f5">Download for iPhone</text>
  <text x="72" y="57" font-size="14" fill="#a1a1aa">iOS 27.2 · install with SideStore · free</text>

  <!-- Download arrow -->
  <g fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(318 26)">
    <path d="M8 0 V16 M2 10 L8 16 L14 10 M1 22 H15"/>
  </g>
</svg>
