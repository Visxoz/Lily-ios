<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190">
  <title>Artist pages with their banner and the whole discography; synced lyrics in the artwork's colours; and a queue you drag into order and save as a playlist</title>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472d0"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, 'SF Pro Display', system-ui, 'Segoe UI Variable Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 700; fill: #ffffff; }
      .cap { font-size: 17px; fill: #98989d; }
    </style>
  </defs>
  <g transform="translate(0.0 0)">
    <rect x="0.5" y="0.5" width="413.7" height="189" rx="24" fill="#1c1c1e"/>
    <rect x="32" y="32" width="120" height="44" rx="8" fill="url(#ink)"/><rect x="42" y="58" width="56" height="8" rx="4" fill="#ffffff"/><circle cx="176" cy="54" r="16" fill="#d65db1"/><path d="M171 46 L184 54 L171 62 Z" fill="#ffffff"/>
    <text class="title" x="32" y="134">Artist pages</text>
    <text class="cap" x="32" y="164">with their banner and every release</text>
  </g>
  <g transform="translate(432.7 0)">
    <rect x="0.5" y="0.5" width="413.7" height="189" rx="24" fill="#1c1c1e"/>
    <rect x="32" y="34" width="150" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.3"/><rect x="32" y="51" width="190" height="11" rx="5.5" fill="#ffffff"/><rect x="32" y="70" width="130" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.3"/>
    <text class="title" x="32" y="134">Synced lyrics</text>
    <text class="cap" x="32" y="164">in the artwork's colours, tap to jump</text>
  </g>
  <g transform="translate(865.3 0)">
    <rect x="0.5" y="0.5" width="413.7" height="189" rx="24" fill="#1c1c1e"/>
    <rect x="32" y="32" width="14" height="14" rx="3" fill="url(#ink)"/><rect x="54" y="36" width="120" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.9"/><path d="M222 35 H236 M222 39 H236 M222 43 H236" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/><rect x="32" y="54" width="14" height="14" rx="3" fill="url(#ink)"/><rect x="54" y="58" width="96" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.5"/><path d="M222 57 H236 M222 61 H236 M222 65 H236" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/><rect x="32" y="76" width="14" height="14" rx="3" fill="url(#ink)"/><rect x="54" y="80" width="110" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.5"/><path d="M222 79 H236 M222 83 H236 M222 87 H236" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
    <text class="title" x="32" y="134">Up next</text>
    <text class="cap" x="32" y="164">drag it into order, save it as a playlist</text>
  </g>
</svg>
