      <rect x="97" y="302" width="5" height="20" rx="1.5"/>
    </g>
    <rect x="22" y="342" width="144" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.24"/>
    <rect x="28" y="346" width="36" height="24" rx="12" fill="#ffffff" fill-opacity="0.14"/>
