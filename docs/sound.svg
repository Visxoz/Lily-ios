      .pill { fill: #ffffff; fill-opacity: 0.07; stroke: #ffffff; stroke-opacity: 0.14; }
      .body { fill: #1b1b20; stroke: #ffffff; stroke-opacity: 0.16; stroke-width: 1.5; }
      .num { font-size: 17px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .name { font-size: 20px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .note { font-size: 16px; fill: #98989d; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1280" height="470" rx="28" fill="#1c1c1e"/>

  <text x="300" y="86" font-size="19" font-weight="500" fill="#98989d">The sound's path</text>
  <text x="296" y="150" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#ffffff">From YouTube to your ears</text>
  <text x="300" y="192" font-size="21" fill="#98989d">Every step the sound takes, in the order you hear it.</text>

