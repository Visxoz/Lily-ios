  <text class="name" x="330" y="366">Stream</text><text class="note" x="330" y="392">Opus or AAC,</text><text class="note" x="330" y="414">up to 256 kbps</text><text class="name" x="470" y="366">Levelling</text><text class="note" x="470" y="392">from YouTube's</text><text class="note" x="470" y="414">own loudness</text><text class="name" x="610" y="366">Crossfade</text><text class="note" x="610" y="392">gapless, or</text><text class="note" x="610" y="414">1 to 12 seconds</text><text class="name" x="750" y="366">Speed</text><text class="note" x="750" y="392">0.8× to 1.3×,</text><text class="note" x="750" y="414">when not 1×</text><text class="name" x="890" y="366">Equaliser</text><text class="note" x="890" y="392">ten bands,</text><text class="note" x="890" y="414">±12 dB each</text><text class="name" x="1030" y="366">Headphones</text><text class="note" x="1030" y="392">crossfeed, mono</text><text class="note" x="1030" y="414">and balance</text><text class="name" x="1170" y="366">Limiter</text><text class="note" x="1170" y="392">so nothing</text><text class="note" x="1170" y="414">ever clips</text>
